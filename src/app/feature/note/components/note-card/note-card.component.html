<div
  class="border-t-4 border-t-rose-500 p-5 rounded-2xl bg-white shadow-md hover:shadow-lg transition-shadow duration-300">


  <h2 class="text-center text-xl font-semibold text-rose-500 mb-3 truncate">
    {{note()?.title}}
  </h2>


  <hr class="border-rose-100 mb-3">


  <p class="text-center text-gray-500 text-sm line-clamp-3 min-h-15">
    {{note()?.content}}
  </p>


  <div class="flex justify-center items-center gap-6 mt-4 pt-3 border-t border-rose-100">
    <button class="text-rose-400 hover:text-rose-600 transition-colors cursor-pointer" (click)="editNote(note()!)">
      <i class="fa-solid fa-pen-to-square text-lg"></i>
    </button>
    <button class="text-rose-400 hover:text-rose-600 transition-colors cursor-pointer"
      (click)="deleteNote(note()?._id!)">
      <i class="fa-solid fa-trash text-lg"></i>
    </button>
  </div>

</div>
