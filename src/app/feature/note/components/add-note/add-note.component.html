<mat-card class="p-5 min-w-[400px]">
  <mat-card-header>
    <div class="flex justify-between items-center w-full mb-4">
      <h2 class="text-xl font-semibold text-rose-500">Add new Note</h2>
      <button class="text-rose-500 cursor-pointer hover:text-rose-700 transition-colors" (click)="close()">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="objNote">

      <div class="mb-4">
        <label class="block mb-1.5 text-sm font-medium text-rose-400">Title</label>
        <input type="text" formControlName="title"
          class="border border-gray-200 text-gray-800 text-sm rounded-lg focus:outline-none focus:border-rose-400 block w-full px-3 py-2.5 shadow-sm placeholder:text-gray-400"
          placeholder="Note title..." />
      </div>

      <div class="mb-6">
        <label class="block mb-1.5 text-sm font-medium text-rose-400">Content</label>
        <textarea rows="5" formControlName="content"
          class="border border-gray-200 text-gray-800 text-sm rounded-lg focus:border-rose-400 focus:outline-none block w-full p-3 shadow-sm placeholder:text-gray-400 resize-none"
          placeholder="Write your thoughts here..."></textarea>
      </div>

      <div class="flex gap-3 justify-center">

        @if (noteEdit()) {

        <button class="btnSend" (click)="updateData()">
          <i class="fa-solid fa-pen mr-2"></i>Update
        </button>
        }
        @else {
        <button class="btnSend" (click)="sendData()">
          <i class="fa-solid fa-plus mr-2"></i>Save
        </button>
        }
      </div>

    </form>
  </mat-card-content>
</mat-card>
